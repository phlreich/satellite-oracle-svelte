<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>phlreich</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html, body {
				width: 100%;
				height: 100%;
				background: #000;
				color: white;
				font-family: Consolas, 'Courier New', 'Liberation Mono', monospace;
			}

			body {
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				padding: 30px;
			}

			h1 {
				font-size: x-large;
				font-weight: normal;
				letter-spacing: 0.2em;
				margin-bottom: 20px;
			}

			.rule {
				width: 100%;
				max-width: 280px;
				height: 1px;
				background: rgba(255, 255, 255, 0.15);
				margin-bottom: 24px;
			}

			.section-label {
				font-size: small;
				letter-spacing: 0.12em;
				color: rgba(255, 255, 255, 0.35);
				text-transform: uppercase;
				margin-bottom: 12px;
			}

			.entries {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}

			.entry {
				display: block;
				padding: 8px 0 8px 12px;
				border-left: 2px solid rgba(255, 255, 255, 0.15);
				color: rgba(255, 255, 255, 0.6);
				text-decoration: none;
				font-size: large;
				letter-spacing: 0.04em;
			}

			.entry:hover {
				color: white;
				border-left-color: white;
			}
		</style>
	</head>
	<body>
		<h1>PHLREICH</h1>
		<div class="rule"></div>
		<div class="section-label">Projects</div>
		<div class="entries">
			<a class="entry" href="/satellite-oracle">Satellite Oracle</a>
		</div>
	</body>
</html>
