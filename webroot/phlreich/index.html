<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>phlreich.com</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background: #000;
				color: white;
				overflow: hidden;
			}

			body {
				display: grid;
				place-items: center;
			}

			main {
				position: absolute;
				bottom: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.9);
				padding: 15px 20px;
				border: 1px solid white;
				border-radius: 5px;
			}

			h1 {
				font-size: x-large;
				letter-spacing: 0.15em;
				margin: 0 0 12px 0;
			}

			a {
				color: white;
				font-size: large;
				text-decoration: none;
				border: 1px solid #ccc;
				border-radius: 5px;
				padding: 5px 15px;
				background: rgba(0, 0, 0, 0.9);
				display: inline-block;
			}

			a:hover {
				background: #232121;
				border-color: #aaa;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>PHLREICH</h1>
			<a href="/satellite-oracle">Satellite Oracle</a>
		</main>
	</body>
</html>
