<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>phlreich</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				background: #000;
				color: white;
				font-family: Consolas, 'Courier New', 'Liberation Mono', monospace;
			}

			body {
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				padding: 30px;
			}

			h1 {
				font-size: x-large;
				font-weight: normal;
				letter-spacing: 0.2em;
				margin-bottom: 20px;
			}

			.rule {
				width: 100%;
				max-width: 280px;
				height: 1px;
				background: rgba(255, 255, 255, 0.15);
				margin-bottom: 24px;
			}

			.section-label {
				font-size: small;
				letter-spacing: 0.12em;
				color: rgba(255, 255, 255, 0.35);
				text-transform: uppercase;
				margin-bottom: 12px;
			}

			.entries {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}

			.entry {
				display: block;
				padding: 8px 0 8px 12px;
				border-left: 2px solid rgba(255, 255, 255, 0.15);
				color: rgba(255, 255, 255, 0.6);
				text-decoration: none;
				font-size: large;
				letter-spacing: 0.04em;
			}

			.entry:hover {
				color: white;
				border-left-color: white;
			}
		</style>
	</head>
	<body>
		<h1>PHLREICH</h1>
		<div class="rule"></div>
		<div class="section-label">Projects</div>
		<div class="entries">
			<a class="entry" href="/satellite-oracle" data-warm-target="satellite-oracle">
				Satellite Oracle
			</a>
		</div>
		<script>
			(() => {
				const sceneDataUrl = '/satellite-oracle/data/scene-data.json';
				const oracleLink = document.querySelector('[data-warm-target="satellite-oracle"]');
				let warmStarted = false;

				// Start a low-priority fetch so the large scene payload is cached before navigation.
				const shouldWarmInBackground = () => {
					const connection =
						navigator.connection ?? navigator.mozConnection ?? navigator.webkitConnection;
					if (!connection) {
						return true;
					}
					if (connection.saveData) {
						return false;
					}
					return connection.effectiveType !== 'slow-2g' && connection.effectiveType !== '2g';
				};

				const warmSceneData = () => {
					if (warmStarted || !shouldWarmInBackground()) {
						return;
					}
					warmStarted = true;
					void fetch(sceneDataUrl, { cache: 'force-cache' }).catch(() => {});
				};

				const scheduleWarmup = () => {
					if ('requestIdleCallback' in window) {
						window.requestIdleCallback(warmSceneData, { timeout: 1500 });
						return;
					}
					window.setTimeout(warmSceneData, 700);
				};

				window.addEventListener('load', scheduleWarmup, { once: true });

				if (!oracleLink) {
					return;
				}

				oracleLink.addEventListener('pointerenter', warmSceneData, {
					once: true,
					passive: true
				});
				oracleLink.addEventListener('focus', warmSceneData, { once: true });
				oracleLink.addEventListener('touchstart', warmSceneData, {
					once: true,
					passive: true
				});
			})();
		</script>
	</body>
</html>
