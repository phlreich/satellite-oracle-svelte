<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>phlreich.com</title>
		<style>
			:root {
				color-scheme: dark;
				font-family:
					'IBM Plex Sans',
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				background: #050607;
				color: #dfe6ee;
				letter-spacing: 0.01em;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background:
					radial-gradient(circle at 20% 20%, rgba(80, 120, 180, 0.18), transparent 35%),
					radial-gradient(circle at 80% 0%, rgba(60, 200, 255, 0.12), transparent 40%),
					linear-gradient(180deg, #050607 0%, #080a0e 60%, #050607 100%);
			}

			main {
				width: min(640px, 92vw);
				padding: 2.75rem 2.4rem;
				border: 1px solid rgba(223, 230, 238, 0.12);
				border-radius: 18px;
				background: rgba(7, 9, 12, 0.82);
				box-shadow:
					0 25px 60px rgba(0, 0, 0, 0.55),
					inset 0 1px 0 rgba(255, 255, 255, 0.04);
				display: grid;
				gap: 1.6rem;
			}

			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
			}

			h1 {
				font-size: clamp(2.25rem, 4vw, 3.1rem);
				letter-spacing: 0.22em;
				margin: 0;
				text-transform: uppercase;
			}

			.badge {
				border: 1px solid rgba(223, 230, 238, 0.22);
				border-radius: 999px;
				padding: 0.35rem 0.85rem;
				font-size: 0.9rem;
				text-transform: uppercase;
				letter-spacing: 0.12em;
				background: rgba(223, 230, 238, 0.06);
				color: #9fb7d6;
				white-space: nowrap;
			}

			p {
				margin: 0;
				font-size: 1.05rem;
				line-height: 1.65;
				color: #c4cedb;
				max-width: 54ch;
			}

			.divider {
				height: 1px;
				width: 100%;
				background: linear-gradient(
					90deg,
					rgba(255, 255, 255, 0),
					rgba(255, 255, 255, 0.12),
					rgba(255, 255, 255, 0)
				);
			}

			.meta {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
				gap: 0.75rem;
				font-size: 0.95rem;
				color: #8ca0ba;
			}

			.meta span {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				padding: 0.55rem 0.75rem;
				border-radius: 10px;
				background: rgba(223, 230, 238, 0.05);
				border: 1px solid rgba(223, 230, 238, 0.08);
			}

			a.cta {
				display: inline-flex;
				align-items: center;
				gap: 0.45rem;
				padding: 0.95rem 1.6rem;
				border-radius: 12px;
				border: 1px solid rgba(159, 183, 214, 0.55);
				color: inherit;
				text-decoration: none;
				font-weight: 600;
				letter-spacing: 0.04em;
				transition:
					transform 160ms ease,
					box-shadow 160ms ease,
					border-color 160ms ease;
				background: linear-gradient(120deg, rgba(159, 183, 214, 0.14), rgba(79, 118, 184, 0.08));
			}

			a.cta:hover {
				transform: translateY(-1px);
				border-color: rgba(159, 183, 214, 0.9);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
			}

			a.cta:active {
				transform: translateY(0);
			}

			.subtext {
				font-size: 0.95rem;
				color: #7788a3;
				letter-spacing: 0.04em;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="header">
				<h1>PHLREICH</h1>
			</div>

			<div class="divider" aria-hidden="true"></div>

			<a class="cta" href="/satellite-oracle" aria-label="Launch Satellite Oracle">
				Satellite Oracle →
			</a>

			<div class="subtext">Route: /satellite-oracle • TLS via Cloudflare Tunnel</div>
		</main>
	</body>
</html>
