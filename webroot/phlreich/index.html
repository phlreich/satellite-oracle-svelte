<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>phlreich.com</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        background-color: #050505;
        color: #f5f5f5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, rgba(88, 151, 255, 0.3), transparent 60%),
          #050505;
      }

      main {
        text-align: center;
        padding: 3rem 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.25rem;
        max-width: 560px;
        background-color: rgba(5, 5, 5, 0.8);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      }

      h1 {
        font-size: clamp(2.5rem, 4vw, 3.5rem);
        letter-spacing: 0.1em;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        opacity: 0.8;
        margin-bottom: 2.5rem;
      }

      a.cta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.95rem 1.8rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: inherit;
        text-decoration: none;
        font-weight: 500;
        transition: all 180ms ease;
        background: linear-gradient(120deg, rgba(255, 255, 255, 0.05), transparent);
      }

      a.cta:hover {
        border-color: rgba(255, 255, 255, 0.8);
        transform: translateY(-2px);
        background: linear-gradient(120deg, rgba(93, 144, 255, 0.2), transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PHLREICH</h1>
      <p>Satellite Oracle now lives under the phlreich.com umbrella.</p>
      <a class="cta" href="/satellite-oracle">Launch Satellite Oracle →</a>
    </main>
  </body>
</html>
