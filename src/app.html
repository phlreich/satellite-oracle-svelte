<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/sat.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
			<style>
				:root {
					--cursor-blink-duration: 0.6s;
				}
				/* Loading screen - inline for instant display */
				#loading-screen {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: grid;
				place-items: center;
				background: #000;
				transition:
					opacity 0.6s ease-out,
					visibility 0.6s ease-out;
			}
			#loading-screen.fade-out {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			.loader-text {
				color: white;
				font-family: Consolas, 'Courier New', 'Liberation Mono', monospace;
				font-size: x-large;
				letter-spacing: 0.25em;
				text-transform: uppercase;
			}
				.loader-cursor {
					display: inline-block;
					width: 0.6em;
					height: 1.1em;
					background: white;
					vertical-align: text-bottom;
					margin-left: 0.15em;
					animation: blink var(--cursor-blink-duration, 0.6s) step-end infinite;
				}
			@keyframes blink {
				0%, 100% { opacity: 1; }
				50% { opacity: 0; }
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="loading-screen">
			<div class="loader-text">INITIALIZING<span class="loader-cursor"></span></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
