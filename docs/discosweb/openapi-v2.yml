components:
  securitySchemes:
    OpenID Connect:
      type: openIdConnect
      openIdConnectUrl: https://auth.sdo.esoc.esa.int/.well-known/openid-configuration
    Personal Access Token:
      type: http
      scheme: bearer

  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Total number of requests allowed in the active window.
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Number of requests remaining in the active window.
    X-RateLimit-Reset:
      schema:
        type: integer
      description:
        Time when the window will be reset, as the number of seconds since the
        unix epoch.

  parameters:
    discosId:
      name: discosId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 34599

    id:
      name: id
      in: path
      required: true
      schema:
        type: string

    sort:
      name: sort
      in: query
      schema:
        type: string
      description: |
        Must be a comma-separated list of relationship paths. A relationship path
        is a dot-separated list of relationship names. Descending sort order may
        be indicated by prefixing the relationship path with a minus.

        See [JSON:API – Sorting][sorting] for more information.

        [sorting]: https://jsonapi.org/format/#fetching-sorting
      example: -mass

    filter:
      name: filter
      in: query
      schema:
        type: string
      description: |
        JSON:API is agnostic about the syntax used to filter. DISCOSweb's
        implementation is documented in the [filtering section].

        [filtering section]: #section/Filtering

    pageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100

    pageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1

    include:
      name: include
      description: |
        The value of the include parameter must be a comma-separated list of
        relationship paths. A relationship path is a dot-separated list of
        relationship names.

        See [JSON:API – Inclusion of Related Resources][include] for more information.

        [include]: https://jsonapi.org/format/#fetching-includes
      in: query
      schema:
        type: string

    include-entities:
      name: include
      description: |
        The value of the include parameter must be a comma-separated list of
        relationship paths. A relationship path is a dot-separated list of
        relationship names. **Due to the large number of results, `launches` and
        `objects` can not be included. Instead, use separate queries to the API
        endpoints provided in relationships.**

        See [JSON:API – Inclusion of Related Resources][include] for more information.

        [include]: https://jsonapi.org/format/#fetching-includes
      in: query
      schema:
        type: string

    fields:
      name: fields
      description: |
        The fields parameter enabled sparse fieldsets — the ability to only
        request specific fields in the response on a per-type basis.

        See [JSON:API – Sparse Fieldsets][sparse] for more information.

        [sparse]: https://jsonapi.org/format/#fetching-sparse-fieldsets
      in: query
      style: deepObject
      explode: true
      schema:
        type: object
        properties:
          constellation:
            type: string
          country:
            type: string
          destinationOrbit:
            type: string
          engine:
            type: string
          fragmentation:
            type: string
          fragmentationEventType:
            type: string
          initialOrbit:
            type: string
          inhabitableSpacecraft:
            type: string
          launch:
            type: string
          launchSite:
            type: string
          launchSystem:
            type: string
          object:
            type: string
          objectClass:
            type: string
          organisation:
            type: string
          propellant:
            type: string
          reentry:
            type: string
          stage:
            type: string
          tag:
            type: string
          vehicle:
            type: string
          vehicleFamily:
            type: string
      example:
        object: cosparId,name
        launch: epoch

  schemas:
    success:
      required:
        - data
      properties:
        included:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
            # we don't use allOf with #/components/schemas/resource here
            # because it breaks the discriminator rendering in ReDoc
            oneOf:
              - $ref: '#/components/schemas/country'
              - $ref: '#/components/schemas/destinationOrbit'
              - $ref: '#/components/schemas/object'
              - $ref: '#/components/schemas/engine'
              - $ref: '#/components/schemas/fragmentation'
              - $ref: '#/components/schemas/fragmentationEventType'
              - $ref: '#/components/schemas/initialOrbit'
              - $ref: '#/components/schemas/launch'
              - $ref: '#/components/schemas/launchSite'
              - $ref: '#/components/schemas/launchSystem'
              - $ref: '#/components/schemas/vehicle'
              - $ref: '#/components/schemas/stage'
              - $ref: '#/components/schemas/objectClass'
              - $ref: '#/components/schemas/organisation'
              - $ref: '#/components/schemas/propellant'
              - $ref: '#/components/schemas/reentry'
              - $ref: '#/components/schemas/vehicleFamily'
              - $ref: '#/components/schemas/tag'
            discriminator:
              propertyName: type
        links:
          allOf:
            - $ref: '#/components/schemas/links'
            - $ref: '#/components/schemas/paginationLinks'
        meta:
          allOf:
            - $ref: '#/components/schemas/meta'
            - $ref: '#/components/schemas/paginationMeta'

    links:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/link'

    paginationLinks:
      type: object
      properties:
        first:
          allOf:
            - $ref: '#/components/schemas/link'
            - description: The link to the first page of the paginated response.
        last:
          allOf:
            - $ref: '#/components/schemas/link'
            - description: The link to the last page of the paginated response.
        next:
          description: The link to the next page of the paginated
            response (if it exists).
          anyOf:
            - $ref: '#/components/schemas/link'
            - type: 'null'
        prev:
          description: The link to the previous page of the paginated
            response (if it exists).
          anyOf:
            - $ref: '#/components/schemas/link'
            - type: 'null'

    link:
      title: Link
      oneOf:
        - description: A string containing the link's URL
          type: string
          format: uri-reference
        - type: object
          required: [href]
          properties:
            href:
              description: A string containing the link's URL
              type: string
              format: uri-reference
            meta:
              $ref: '#/components/schemas/meta'

    meta:
      description: >
        Non-standard meta-information that can not be represented as an
        attribute or relationship.
      type: object
      additionalProperties: true

    paginationMeta:
      type: object
      properties:
        pagination:
          description:
            If the response is paginated, this object will be included
            in the response.
          type: object
          required: [totalPages, currentPage, pageSize]
          properties:
            totalPages:
              type: integer
            currentPage:
              type: integer
            pageSize:
              type: integer

    relationship:
      type: object
      properties:
        links:
          properties:
            self:
              type: string
              description: A link for the relationship itself.
            related:
              type: string
          additionalProperties: true
        data:
          description: Resource linkage.
          oneOf:
            - $ref: '#/components/schemas/relationshipToOne'
            - $ref: '#/components/schemas/relationshipToMany'
        meta:
          $ref: '#/components/schemas/meta'

    emptyRelationship:
      description: Describes an empty to-one relationship.
      type: 'null'

    linkage:
      description: The "type" and "id" to non-empty members.
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/type'
        meta:
          $ref: '#/components/schemas/meta'

    relationshipToOne:
      description: References to other resource objects in a to-one relationship.
      anyOf:
        - $ref: '#/components/schemas/emptyRelationship'
        - $ref: '#/components/schemas/linkage'

    relationshipToMany:
      description: An array of references to objects in a to-many relationship.
      type: array
      items:
        $ref: '#/components/schemas/linkage'

    type:
      type: string
      enum:
        - country
        - destinationOrbit
        - engine
        - fragmentation
        - fragmentationEventType
        - initialOrbit
        - launch
        - launchSite
        - launchSystem
        - object
        - objectClass
        - organisation
        - propellant
        - reentry
        - stage
        - vehicle
        - vehicleFamily

    error:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for this particular occurrence of the
            problem.
        links:
          $ref: '#/components/schemas/links'
        status:
          type: string
          description: The HTTP status code for this error.
        code:
          type: string
          description: The error code for this type of error.
        title:
          type: string
          description: A short explanation of the error.
        detail:
          type: string
          description: More information about the error.
        source:
          type: object
          properties:
            pointer:
              type: string
              description:
                A JSON pointer to the associated entity in the request
                document.
            parameter:
              type: string
              description: Which query parameter caused the error.
        meta:
          $ref: '#/components/schemas/meta'

    numRange:
      type: object
      properties:
        lower:
          type:
            - number
            - 'null'
          description: The lower bound of this range, or null if there isn't one.
          examples:
            - -5
        upper:
          type:
            - number
            - 'null'
          description: The upper bound of this range, or null if there isn't one.
          examples:
            - 10
        lowerInc:
          type: boolean
          description: Whether the lower bound is inclusive.
          examples:
            - true
        upperInc:
          type: boolean
          description: Whether the upper bound is inclusive.
          examples:
            - false
        empty:
          type: boolean
          description: true when the range is empty.
          examples:
            - false
        display:
          type: string
          description: A
          examples:
            - '[-5,10)'

    dateRange:
      type: object
      properties:
        lower:
          type:
            - string
            - 'null'
          format: date
          description: The lower bound of this range, or null if there isn't one.
          examples:
            - 1975-05-30
        upper:
          type:
            - string
            - 'null'
          format: date
          description: The upper bound of this range, or null if there isn't one.
          examples:
            - 2019-01-01
        lowerInc:
          type: boolean
          description: Whether the lower bound is inclusive.
          examples:
            - true
        upperInc:
          type: boolean
          description: Whether the upper bound is inclusive.
          examples:
            - false
        empty:
          type: boolean
          description: true when the range is empty.
          examples:
            - false
        display:
          type: string
          description: A
          examples:
            - '[1975-05-30,2019-01-01)'

    object:
      required: [id, type]
      properties:
        id:
          type: string
          description: |
            The DISCOS ID is an integer, but is transmitted as a string
            according to the JSON:API spec.
        type:
          type: string
          enum: [object]
        attributes:
          properties:
            cosparId:
              type: string
              description: International Designator
            satno:
              type:
                - integer
                - 'null'
              description: Satellite Catalogue Number assigned by USSPACECOM
            vimpelId:
              type:
                - integer
                - 'null'
              description: JSC Vimpel sequence number
            name:
              type:
                - string
                - 'null'
            objectClass:
              type: string
            mass:
              type:
                - number
                - 'null'
              description: Mass (kg)
            shape:
              type:
                - string
                - 'null'
              description: Coarse description of object shape.
            width:
              type:
                - number
                - 'null'
              description: Width (m)
            height:
              type:
                - number
                - 'null'
              description: Height (m)
            depth:
              type:
                - number
                - 'null'
              description: Depth (m)
            diameter:
              type:
                - number
                - 'null'
              description: Diameter (m)
            span:
              type:
                - number
                - 'null'
              description: Largest dimension including appendices (m)
            xSectMax:
              type:
                - number
                - 'null'
              description: Computed maximum cross section (m<sup>2</sup>)
            xSectMin:
              type:
                - number
                - 'null'
              description: Computed minimum cross section (m<sup>2</sup>)
            xSectAvg:
              type:
                - number
                - 'null'
              description: Computed average cross section (m<sup>2</sup>)
            firstEpoch:
              type:
                - string
                - 'null'
              format: date-time
            mission:
              type:
                - string
                - 'null'
            predDecayDate:
              type:
                - string
                - 'null'
              format: date-time
            active:
              type:
                - boolean
                - 'null'
        relationships:
          properties:
            launch:
              $ref: '#/components/schemas/relationship'
            reentry:
              $ref: '#/components/schemas/relationship'
            initialOrbits:
              $ref: '#/components/schemas/relationship'
            destinationOrbits:
              $ref: '#/components/schemas/relationship'
            states:
              $ref: '#/components/schemas/relationship'
            operators:
              $ref: '#/components/schemas/relationship'
            tags:
              $ref: '#/components/schemas/relationship'
            constellations:
              $ref: '#/components/schemas/relationship'
        links:
          $ref: '#/components/schemas/links'

    objectClass:
      required: [id, type]
      properties:
        id:
          type: string
          description: Object class ID
          examples:
            - '8c489317-9b02-5e18-9a9a-8bc50d05a1b6'
        type:
          type: string
          enum: [objectClass]
        attributes:
          properties:
            name:
              type: string
              examples:
                - Payload
        links:
          $ref: '#/components/schemas/links'

    propellant:
      required: [id, type]
      properties:
        id:
          type: string
          description: Propellant ID
          examples:
            - '123'
        type:
          type: string
          enum: [propellant]
        attributes:
          properties:
            oxidiser:
              type:
                - string
                - 'null'
              examples:
                - LOX
            fuel:
              type:
                - string
                - 'null'
              examples:
                - Kerosene
            solidPropellant:
              type:
                - string
                - 'null'
              examples:
                - null
        relationships:
          properties:
            stages:
              $ref: '#/components/schemas/relationship'
        links:
          $ref: '#/components/schemas/links'

    launch:
      required: [id, type]
      properties:
        id:
          type: string
          description: Launch ID
          examples:
            - '123'
        type:
          type: string
          enum: [launch]
        attributes:
          properties:
            epoch:
              type:
                - string
                - 'null'
              format: date-time
              description: Launch epoch
            flightNo:
              type:
                - string
                - 'null'
              description: Flight number
              examples:
                - VV15
            cosparLaunchNo:
              type:
                - string
                - 'null'
              description: >
                The year and launch parts of the international designator. E.g.
                2019-001
              examples:
                - 2019-001
            failure:
              type: boolean
              description: Whether the launch failed.
        relationships:
          properties:
            objects:
              $ref: '#/components/schemas/relationship'
            vehicle:
              $ref: '#/components/schemas/relationship'
            site:
              $ref: '#/components/schemas/relationship'
            entities:
              $ref: '#/components/schemas/relationship'
        links:
          $ref: '#/components/schemas/links'

    launchSite:
      required: [id, type]
      properties:
        id:
          type: string
          description: Launch Site ID
          examples:
            - '123'
        type:
          type: string
          enum: [launchSite]
        attributes:
          properties:
            name:
              type: string
              examples:
                - Guiana Space Center (Kourou)
            pads:
              type:
                - array
                - 'null'
              items:
                type: string
                description: Name of individual launch pad
              examples:
                - [ELA1, ELA2, ELA3]
            azimuths:
              type:
                - array
                - 'null'
              items:
                $ref: '#/components/schemas/numRange'
            constrains:
              type:
                - array
                - 'null'
              items:
                type: string
            latitude:
              type:
                - string
                - 'null'
              format: decimal
              examples:
                - '5.2000'
            longitude:
              type:
                - string
                - 'null'
              format: decimal
              examples:
                - '-52.8000'
            altitude:
              type:
                - number
                - 'null'
              examples:
                - 0
        relationships:
          properties:
            launches:
              $ref: '#/components/schemas/relationship'
            operators:
              $ref: '#/components/schemas/relationship'
        links:
