# satellite-oracle-svelte/docker-compose.yml
services:
  app:
    build:
      context: .
    restart: unless-stopped
    volumes:
      - ./src/data:/usr/src/app/src/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/satellite-oracle/health']
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - EMAIL
      - PASSWORD
      - OPENAI_API_KEY

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webroot/phlreich:/usr/share/nginx/html:ro
      - ./src/data:/usr/share/nginx/scene-data:ro
    depends_on:
      app:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.1.2
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    network_mode: 'service:nginx'
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARED_TUNNEL_TOKEN
