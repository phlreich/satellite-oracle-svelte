# satellite-oracle-svelte/nginx.conf
server {
    listen 80;
    listen [::]:80;
    server_name phlreich.com www.phlreich.com;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Serve the small static landing page directly from nginx
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Always redirect bare /satellite-oracle to the trailing slash so relative
    # references inside the Svelte bundle remain stable.
    location = /satellite-oracle {
        return 301 /satellite-oracle/;
    }

    location /satellite-oracle/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Strip upstream COOP/COEP headers to avoid duplicates, then add once
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}

# Safety redirect for requests to the legacy domain.
server {
    listen 80;
    listen [::]:80;
    server_name satellite-oracle.com www.satellite-oracle.com;
    return 301 https://phlreich.com/satellite-oracle$request_uri;
}