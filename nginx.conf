# satellite-oracle-svelte/nginx.conf
server {
    listen 443 ssl;
    http2 on;

    server_name satellite-oracle.com www.satellite-oracle.com;  # Replace with domain or IP
    
    ssl_certificate /etc/ssl/certs/www.satellite-oracle.com_ssl_certificate.cer;   
    ssl_certificate_key /etc/ssl/certs/www.satellite-oracle.com_private_key.key;

    add_header 'Access-Control-Allow-Origin' 'https://satellite-oracle.com';
    add_header 'Access-Control-Allow-Methods' 'GET' always;
    add_header 'Cross-Origin-Opener-Policy' 'same-origin' always;
    add_header 'Cross-Origin-Embedder-Policy' 'require-corp' always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        proxy_pass http://app:3000;  # Proxy pass to Node.js server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name satellite-oracle.com www.satellite-oracle.com;  # Same as above
    return 301 https://$server_name$request_uri;
}