# satellite-oracle-svelte/nginx.conf
limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name phlreich.com www.phlreich.com;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 20k;

    # Serve the small static landing page directly from nginx
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /satellite-oracle/data/scene-data.json {
        alias /usr/share/nginx/scene-data/scene-data.json;
        default_type application/json;
        gzip_static on;
        add_header Cache-Control "public, max-age=300" always;
    }

    location /satellite-oracle/api/ {
        limit_req zone=api_ratelimit burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Strip upstream COOP/COEP headers to avoid duplicates, then add once
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Serve the Svelte app under /satellite-oracle without forcing a trailing slash.
    location /satellite-oracle {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Strip upstream COOP/COEP headers to avoid duplicates, then add once
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}

# Safety redirect for requests to the legacy domain.
server {
    listen 80;
    listen [::]:80;
    server_name satellite-oracle.com www.satellite-oracle.com;
    return 301 https://phlreich.com/satellite-oracle$request_uri;
}
